name: generate snake
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9D6CE8&color_dots=#F7F5FA,#D9D2E8,#B8A6D9,#8A6FB8,#00A8CC&color_background=#FFFFFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9D6CE8&color_dots=#0A0712,#1E1729,#3C2A5C,#6C4FA8,#00D1FF&color_background=#0A0712
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
