name: generate snake
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0071E3&color_dots=#F5F5F7,#D9D9DE,#B0B0B5,#6E6E73,#1D1D1F&color_background=#FFFFFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#64D2FF&color_dots=#0E0E12,#1B2430,#2C5A75,#3F8FAE,#64D2FF&color_background=#08080A
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
