<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D1FF"/><stop offset="1" stop-color="#9D6CE8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E4DEF5"/><stop offset="1" stop-color="#B8A6D9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D1FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D1FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00D1FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#17121F" stroke-width="1"/>
    </pattern>
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .blink { animation: blink 1.2s steps(2, start) infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
      .scanline { animation: drop 7s linear infinite; }
      @keyframes drop { 0% { transform: translateY(-6px); } 100% { transform: translateY(360px); } }
      .tw { animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.85; } }
      .gl1 { animation: g1 6s ease-in-out infinite; }
      @keyframes g1 { 0%, 92%, 100% { transform: translate(0,0); opacity: 0.55; } 93% { transform: translate(-3px,0); opacity: 0.9; } 95% { transform: translate(2px,0); opacity: 0.4; } }
      .gl2 { animation: g2 5s ease-in-out infinite; }
      @keyframes g2 { 0%, 90%, 100% { transform: translate(0,0); opacity: 0.55; } 91% { transform: translate(3px,1px); opacity: 0.85; } 94% { transform: translate(-2px,-1px); opacity: 0.4; } }
    </style>
  </defs>
  <rect width="1280" height="360" fill="#0A0712"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.5"/>
  <rect width="1280" height="360" fill="url(#crt)" opacity="0.35"/>
  <rect class="scanline" x="0" y="-6" width="1280" height="2" fill="url(#scan)" opacity="0.5"/>
  <circle class="tw" cx="880" cy="88" r="1.4" fill="#FFFFFF" opacity="0.5"/>
  <circle class="tw" cx="392" cy="286" r="1.2" fill="#9D6CE8" opacity="0.5"/>
  <circle class="tw" cx="1052" cy="262" r="1.6" fill="#00D1FF" opacity="0.5"/>
  <text x="48" y="66" font-family="'Courier New',ui-monospace,monospace" font-size="22" font-weight="bold" fill="#9D6CE8" letter-spacing="2">LV.999</text>
  <rect x="48" y="80" width="190" height="7" fill="#1A1428"/>
  <rect x="48" y="80" width="190" height="7" fill="url(#hp)" opacity="0.9"/>
  <text x="48" y="104" font-family="'Courier New',monospace" font-size="11" fill="#8A8A9A" letter-spacing="1">HP 999/999</text>
  <rect x="48" y="118" width="190" height="4" fill="#1A1428"/>
  <rect x="48" y="118" width="150" height="4" fill="#FF3D9A" opacity="0.75"/>
  <text x="48" y="136" font-family="'Courier New',monospace" font-size="11" fill="#8A8A9A" letter-spacing="1">EXP SUPER-HACKER</text>
  <text x="1232" y="66" text-anchor="end" class="blink" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#00D1FF" letter-spacing="3">&#9670; ONLINE</text>
  <text x="1232" y="90" text-anchor="end" font-family="'Courier New',monospace" font-size="11" fill="#8A8A9A" letter-spacing="1">ETHERS@PUNK_LORD</text>
  <g filter="url(#glow)">
    <text class="gl1" x="637" y="208" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace" font-size="74" font-weight="bold" letter-spacing="10" fill="#9D6CE8" opacity="0.55">SILVER WOLF</text>
    <text class="gl2" x="643" y="208" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace" font-size="74" font-weight="bold" letter-spacing="10" fill="#00D1FF" opacity="0.55">SILVER WOLF</text>
    <text x="640" y="208" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace" font-size="74" font-weight="bold" letter-spacing="10" fill="url(#title)">SILVER WOLF</text>
  </g>
  <text x="640" y="248" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" fill="#C9C2E0" letter-spacing="4">账号在哪，我就在哪。</text>
  <text x="48" y="322" font-family="'Courier New',monospace" font-size="12" fill="#6C6C7E" letter-spacing="2">&gt; SAVE POINT LOADED</text>
  <rect class="blink" x="238" y="311" width="8" height="13" fill="#00D1FF"/>
  <text x="1232" y="322" text-anchor="end" font-family="'Courier New',monospace" font-size="12" fill="#6C6C7E" letter-spacing="2">BUILD 999.0 // NO ROLLBACK</text>
  <line x1="0" y1="1" x2="1280" y2="1" stroke="#241B33" stroke-width="1"/>
  <line x1="0" y1="359" x2="1280" y2="359" stroke="#241B33" stroke-width="1"/>
</svg>
