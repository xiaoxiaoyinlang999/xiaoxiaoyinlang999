<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E8E8ED"/>
      <stop offset="1" stop-color="#7E7E85"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64D2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#64D2FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#121216" stroke-width="1"/>
    </pattern>
    <style>
      .scan { animation: sweep 11s linear infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px); } 100% { transform: translateX(1600px); } }
      .tw1 { animation: tw 4.2s ease-in-out infinite; }
      .tw2 { animation: tw 5.6s ease-in-out infinite 1.1s; }
      .tw3 { animation: tw 6.8s ease-in-out infinite 2.3s; }
      @keyframes tw { 0%,100% { opacity: 0.15; } 50% { opacity: 0.6; } }
    </style>
  </defs>
  <rect width="1280" height="320" fill="#08080A"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect class="scan" x="-320" y="0" width="320" height="320" fill="url(#scanline)" opacity="0.05"/>
  <g fill="#FFFFFF">
    <circle class="tw1" cx="176" cy="72" r="1.1" opacity="0.4"/>
    <circle class="tw2" cx="338" cy="236" r="0.9" opacity="0.3"/>
    <circle class="tw3" cx="642" cy="54" r="1.2" opacity="0.4"/>
    <circle class="tw2" cx="958" cy="252" r="1.0" opacity="0.35"/>
    <circle class="tw1" cx="1118" cy="94" r="1.3" opacity="0.45"/>
    <circle class="tw3" cx="1212" cy="212" r="0.8" opacity="0.3"/>
  </g>
  <text x="640" y="170" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="62" font-weight="200" letter-spacing="16" fill="url(#silver)">SILVER WOLF</text>
  <text x="640" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="5" fill="#64D2FF" opacity="0.85">ACCOUNT ONLINE &#183; LV.999 &#183; CYBERSPACE</text>
  <line x1="0" y1="1" x2="1280" y2="1" stroke="#1A1A1F" stroke-width="1"/>
  <line x1="0" y1="319" x2="1280" y2="319" stroke="#1A1A1F" stroke-width="1"/>
</svg>
