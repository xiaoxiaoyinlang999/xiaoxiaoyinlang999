<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150">
  <defs>
    <linearGradient id="ffade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3A42" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3A3A42"/>
